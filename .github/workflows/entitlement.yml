name: Entitlement preparation and bridge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install game-free crypto fixture dependency
        run: python -m pip install pycryptodome
      - name: Configure standalone fixture
        run: cmake -S tests/entitlement -B build-entitlement -DCMAKE_BUILD_TYPE=Release
      - name: Build production entitlement bridge with synthetic dispatch
        run: cmake --build build-entitlement --config Release --parallel 2
      - name: Verify private preparation and strict license decisions
        run: ctest --test-dir build-entitlement -C Release --output-on-failure
