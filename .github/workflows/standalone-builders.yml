name: Standalone builders
# Builder.AppImage and Builder.exe from one source revision and the pinned
# toolchain manifest, audited, then downloaded and exercised on clean Linux and
# Windows runners without network or installed development tools. Tags stage a
# draft release only after every check passes.
on:
  workflow_dispatch:
  push:
    tags: ['*']
    # Test candidates before they reach master; dispatch needs the default branch.
    branches: ['validation/standalone-builders-*']
permissions:
  contents: read
env:
  TB_CACHE: ${{ github.workspace }}/../tb-cache
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Build-machine headers for SDL2 (never shipped)
        run: |
          sudo apt-get update
          sudo apt-get install -y perl make squashfs-tools libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libxss-dev libxfixes-dev libxrender-dev libpulse-dev libasound2-dev libudev-dev
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ env.TB_CACHE }}
          key: tb-toolchain-${{ hashFiles('ci/toolchain/manifest.json') }}
      - name: Fetch pinned downloads (SHA-256 verified)
        run: |
          python3 scripts/toolchain.py fetch --host linux --cache "$TB_CACHE" --sources
          python3 scripts/toolchain.py fetch --host windows --cache "$TB_CACHE"
      - name: Stage both toolchains
        run: |
          python3 scripts/toolchain.py stage --host linux --cache "$TB_CACHE" --dest "$RUNNER_TEMP/tc-linux"
          python3 scripts/toolchain.py stage --host windows --cache "$TB_CACHE" --dest "$RUNNER_TEMP/tc-windows"
          python3 -m unittest discover -s scripts -p test_toolchain.py
      - name: Build runtime dependencies with Zig
        run: |
          for target in linux windows; do
            python3 scripts/build_runtime_deps.py --toolchain "$RUNNER_TEMP/tc-linux" --cache "$TB_CACHE" \
              --target $target --prefix "$RUNNER_TEMP/deps-$target"
          done
      - name: Build, test and pack both runtimes
        run: |
          TC="$RUNNER_TEMP/tc-linux"
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zig-cache" ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/zig-cache"
          for target in linux windows; do
            "$TC/cmake/bin/cmake" -S . -B build-zig/$target -G Ninja -DCMAKE_MAKE_PROGRAM="$TC/ninja" \
              -DCMAKE_TOOLCHAIN_FILE="$TC/cmake/zig-$target.cmake" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/deps-$target" -DCMAKE_FIND_ROOT_PATH="$RUNNER_TEMP/deps-$target" \
              -DTB_BUILD_RUNTIME_BUNDLE=ON -DPS3RECOMP_RSX_VULKAN=ON -DPython3_EXECUTABLE="$TC/python/bin/python3"
            "$TC/cmake/bin/cmake" --build build-zig/$target --parallel 4
            "$TC/cmake/bin/cmake" --build build-zig/$target --target runtime_bundle
          done
          "$TC/cmake/bin/ctest" --test-dir build-zig/linux --output-on-failure
      - name: Relocated consumers with only the staged tools
        run: |
          for target in linux windows; do
            cp -a build-zig/$target/runtime-bundle "$RUNNER_TEMP/relocated $target bundle"
            python3 scripts/verify_runtime_consumer.py --bundle "$RUNNER_TEMP/relocated $target bundle" \
              --output "$RUNNER_TEMP/consumer $target" --source '${{ github.sha }}' --toolchain "$RUNNER_TEMP/tc-linux"
          done
      - name: Game-free contract suites
        env:
          TB_TEST_RUNTIME_BUNDLE: ${{ github.workspace }}/build-zig/linux/runtime-bundle
        run: |
          export TB_TEST_TOOLCHAIN="$RUNNER_TEMP/tc-linux"
          cd scripts
          python3 -m unittest test_setup_pipeline test_setup_engine test_packaged_route test_player_folder \
            test_package_builder test_audit_builder
      - name: Package both builders
        run: |
          OUT="$RUNNER_TEMP/out"
          RUNTIME=$(python3 -c "import json,sys;sys.path.insert(0,'scripts');import toolchain as t;m=t.load_manifest();print(t.cached('$TB_CACHE',m['packaging']['appimage_runtime']['sha256']))")
          python3 scripts/package_builder.py resources --target linux --runtime-bundle build-zig/linux/runtime-bundle \
            --toolchain "$RUNNER_TEMP/tc-linux" --cache "$TB_CACHE" --source '${{ github.sha }}' --output "$OUT/linux"
          python3 scripts/package_builder.py appdir --resources "$OUT/linux" --output "$OUT/AppDir"
          python3 scripts/package_builder.py appimage --appdir "$OUT/AppDir" --runtime "$RUNTIME" --output "$OUT/Builder.AppImage"
          python3 scripts/package_builder.py resources --target windows --runtime-bundle build-zig/windows/runtime-bundle \
            --toolchain "$RUNNER_TEMP/tc-windows" --cache "$TB_CACHE" --source '${{ github.sha }}' --output "$OUT/windows"
          python3 scripts/package_builder.py stub --toolchain "$RUNNER_TEMP/tc-linux" --output "$OUT/BuilderStub.exe"
          python3 scripts/package_builder.py exe --resources "$OUT/windows" --stub "$OUT/BuilderStub.exe" --output "$OUT/Builder.exe"
      - name: Audit the complete payloads
        run: |
          OUT="$RUNNER_TEMP/out"
          (cd "$OUT" && ./Builder.AppImage --appimage-extract > /dev/null)
          python3 scripts/audit_builder.py "$OUT/squashfs-root" --source '${{ github.sha }}' --json "$OUT/audit-linux.json"
          python3 scripts/audit_builder.py "$OUT/Builder.exe" --source '${{ github.sha }}' --json "$OUT/audit-windows.json"
          python3 scripts/package_builder.py provenance --source '${{ github.sha }}' --output "$OUT/release" \
            --artifact "$OUT/Builder.AppImage" --resources "$OUT/linux" --artifact "$OUT/Builder.exe" --resources "$OUT/windows"
          cp "$OUT/Builder.AppImage" "$OUT/Builder.exe" "$OUT"/audit-*.json "$OUT/release/"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: standalone-builders-${{ github.sha }}
          path: ${{ runner.temp }}/out/release/
          if-no-files-found: error
          retention-days: 14

  linux-consumer:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: standalone-builders-${{ github.sha }}
          path: download
      - name: Checksums and window prerequisites
        run: |
          cd download && sha256sum -c --ignore-missing SHA256SUMS
          sudo apt-get update && sudo apt-get install -y xvfb
      - name: Relocate into a path with spaces and extract
        run: |
          DIR="$RUNNER_TEMP/down load ü"
          mkdir -p "$DIR" && cp download/Builder.AppImage "$DIR/" && chmod +x "$DIR/Builder.AppImage"
          cd "$DIR" && ./Builder.AppImage --appimage-extract > /dev/null && chmod -R a-w squashfs-root
      - name: Remove runner development tools
        run: |
          for tool in gcc g++ cc c++ clang clang++ ld cmake ninja make python3 pip3; do
            for path in $(which -a $tool 2>/dev/null); do sudo chmod 000 "$(readlink -f "$path")" || true; done
          done
      - name: Window opens
        run: xvfb-run -a env -i HOME="$HOME" PATH=/usr/bin:/bin "$RUNNER_TEMP/down load ü/squashfs-root/AppRun" --self-test
      - name: Build and start a synthetic player offline with only the builder's tools
        run: |
          B="$RUNNER_TEMP/down load ü/squashfs-root"
          sudo unshare -n sudo -u "$USER" env -i HOME="$HOME" PATH=/usr/bin:/bin LANG=C.UTF-8 \
            "$B/toolchain/python/bin/python3" -E -s -B "$B/scripts/verify_builder.py" --work "$RUNNER_TEMP/work dir ü"
      - name: A modified download is rejected
        run: |
          B="$RUNNER_TEMP/down load ü/squashfs-root"
          cp -a "$B" "$RUNNER_TEMP/tampered" && chmod -R u+w "$RUNNER_TEMP/tampered"
          echo "# changed" >> "$RUNNER_TEMP/tampered/scripts/setup_engine.py"
          if env -i HOME="$HOME" PATH=/usr/bin:/bin "$B/toolchain/python/bin/python3" -E -s -B \
              "$RUNNER_TEMP/tampered/scripts/verify_builder.py" --work "$RUNNER_TEMP/tampered work"; then
            echo "tampered builder was accepted"; exit 1
          fi

  windows-consumer:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: standalone-builders-${{ github.sha }}
          path: download
      - name: Checksum
        shell: pwsh
        run: |
          $expected = (Get-Content download/SHA256SUMS | Where-Object { $_ -match 'Builder.exe$' }).Split(' ')[0]
          $actual = (Get-FileHash download/Builder.exe -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "Builder.exe checksum mismatch" }
      - name: A damaged download is refused
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("download/Builder.exe"); $bytes[600000] = $bytes[600000] -bxor 1
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\damaged.exe", $bytes)
          $p = Start-Process "$env:RUNNER_TEMP\damaged.exe" -ArgumentList '--extract', "`"$env:RUNNER_TEMP\damaged out`"" -Wait -PassThru
          if ($p.ExitCode -eq 0 -or (Test-Path "$env:RUNNER_TEMP\damaged out\package.json")) { throw "damaged Builder.exe was extracted" }
      - name: Relocate into a path with spaces and extract
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\down load ü"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item download/Builder.exe $dir
          $p = Start-Process "$dir\Builder.exe" -ArgumentList '--extract', "`"$env:RUNNER_TEMP\builder files`"" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path "$env:RUNNER_TEMP\builder files\package.json")) { throw "extraction failed" }
      - name: Block the builder's network access
        shell: pwsh
        run: |
          $b = "$env:RUNNER_TEMP\builder files"
          Get-ChildItem $b -Recurse -Include *.exe | ForEach-Object {
            New-NetFirewallRule -DisplayName "tb-offline" -Direction Outbound -Action Block -Program $_.FullName | Out-Null }
      - name: Window opens
        shell: pwsh
        run: |
          $b = "$env:RUNNER_TEMP\builder files"
          $env:PATH = "C:\Windows\System32;C:\Windows"
          & "$b\toolchain\python\python.exe" -E -s -B "$b\scripts\builder_app.py" --self-test
          if ($LASTEXITCODE -ne 0) { throw "builder window failed" }
      - name: Build and start a synthetic player with only the builder's tools
        shell: pwsh
        run: |
          $b = "$env:RUNNER_TEMP\builder files"
          $env:PATH = "C:\Windows\System32;C:\Windows"
          & "$b\toolchain\python\python.exe" -E -s -B "$b\scripts\verify_builder.py" --work "$env:RUNNER_TEMP\work dir ü"
          if ($LASTEXITCODE -ne 0) { throw "packaged synthetic build failed" }
      - name: Restore network rules
        if: always()
        shell: pwsh
        run: Remove-NetFirewallRule -DisplayName "tb-offline" -ErrorAction SilentlyContinue

  stage-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-consumer, windows-consumer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: standalone-builders-${{ github.sha }}
          path: release
      - name: Draft release candidate (not published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release && sha256sum -c --ignore-missing SHA256SUMS
          gh release create '${{ github.ref_name }}' --repo '${{ github.repository }}' --draft --verify-tag \
            --title 'Tank Battles builders ${{ github.ref_name }}' \
            --notes 'Release candidate. The builders contain no game; they build your own copy from your purchased files.' \
            Builder.AppImage Builder.exe SHA256SUMS provenance.json NOTICES-linux.txt NOTICES-windows.txt
