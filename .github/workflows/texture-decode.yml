name: Texture decoder equivalence
on:
  workflow_dispatch:
  push:
    paths:
      - 'texture_decode*'
      - 'tests/texture_decode*'
      - 'tests/texture_decode/**'
      - 'scripts/instrument_sdk.py'
      - 'external/ps3recomp'
      - '.github/workflows/texture-decode.yml'
  pull_request:
    paths:
      - 'texture_decode*'
      - 'tests/texture_decode*'
      - 'tests/texture_decode/**'
      - 'scripts/instrument_sdk.py'
      - 'external/ps3recomp'
      - '.github/workflows/texture-decode.yml'
permissions:
  contents: read
jobs:
  equivalence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Configure Linux fixture
        if: runner.os == 'Linux'
        run: cmake -S tests/texture_decode -B build-decoder -DCMAKE_BUILD_TYPE=Release
      - name: Configure Windows fixture
        if: runner.os == 'Windows'
        run: cmake -S tests/texture_decode -B build-decoder -A x64 -T ClangCL
      - name: Build game-free fixtures
        run: cmake --build build-decoder --config Release --parallel 2
      - name: Compare specialized and fallback paths
        run: ctest --test-dir build-decoder -C Release --output-on-failure
