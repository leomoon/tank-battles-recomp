name: Game-free Windows Vulkan runtime
on:
  workflow_dispatch:
  push:
    branches: ['master', 'validation/windows-runtime-*']
    paths: ['*.cpp', '*.h', 'CMakeLists.txt', 'cmake/**', 'scripts/**', 'sdk_overrides/**', 'tests/**', 'ci/windows-runtime/**', '.github/workflows/windows-runtime.yml']
  pull_request:
    paths: ['*.cpp', '*.h', 'CMakeLists.txt', 'cmake/**', 'scripts/**', 'sdk_overrides/**', 'tests/**', 'ci/windows-runtime/**', '.github/workflows/windows-runtime.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r external/ps3recomp/requirements.txt
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: windows-runtime-static-0df93a05-llvm22-v1
      - name: Pin dependency ports
        shell: pwsh
        run: |
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch origin 0df93a05b9de080129e653ec4776d7e14a1b2e4f --depth 1
          git -C "$env:VCPKG_INSTALLATION_ROOT" checkout --detach 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          & "$env:VCPKG_INSTALLATION_ROOT/bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure full production host paths with synthetic inputs
        shell: pwsh
        run: >-
          cmake -S . -B build-runtime -A x64 -T ClangCL
          -DTB_BUILD_RUNTIME_BUNDLE=ON -DPS3RECOMP_RSX_VULKAN=ON
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          "-DVCPKG_MANIFEST_DIR=$pwd/ci/windows-runtime"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - uses: actions/cache/save@v6.1.0
        if: always()
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: windows-runtime-static-0df93a05-llvm22-v1
      - name: Verify pinned compiler and embedded shaders
        shell: pwsh
        run: |
          python -c "import json; m=json.load(open('build-runtime/runtime-build.json')); assert m['compiler_id']=='Clang' and m['compiler_version']=='22.1.3',m"
          $validator = Get-ChildItem build-runtime/vcpkg_installed/x64-windows-static/tools -Recurse -Filter 'glslang*.exe' | Select-Object -First 1
          if (!$validator) { throw 'Pinned glslang compiler missing' }
          New-Item -ItemType Directory -Force build-shader-tools | Out-Null
          Copy-Item $validator.FullName build-shader-tools/glslangValidator.exe
          $env:PATH = "$pwd/build-shader-tools;$env:PATH"
          python scripts/compile_depth_shader.py --check
      - name: Compile reusable runtime, renderer and synthetic tools
        run: cmake --build build-runtime --config Release --parallel 4
      - name: Run CPU smoke and production contracts
        run: ctest --test-dir build-runtime -C Release --output-on-failure
      - name: Create audited game-free runtime bundle
        run: cmake --build build-runtime --config Release --target runtime_bundle
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-runtime-${{ github.sha }}
          path: build-runtime/runtime-bundle/
          if-no-files-found: error
          retention-days: 14
  consumer:
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r external/ps3recomp/requirements.txt
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-runtime-${{ github.sha }}
          path: relocated runtime bundle
      - name: Audit download and link fresh synthetic title without runtime compilation
        shell: pwsh
        run: >-
          python scripts/verify_runtime_consumer.py
          --bundle 'relocated runtime bundle' --output 'fresh consumer with spaces'
          --source '${{ github.sha }}'
      - name: Negative artifact integrity checks
        run: python -m unittest discover -s scripts -p test_runtime_bundle.py
      - name: Rerun downloaded host and entitlement contracts
        run: python scripts/verify_bundle_contracts.py --bundle 'relocated runtime bundle'
